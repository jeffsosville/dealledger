name: Alert Digest

on:
  schedule:
    # Mondays 13:37 UTC = 8:37am ET (EST). Off the hour: GitHub queues :00 crons.
    - cron: "37 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print emails instead of sending"
        type: boolean
        default: true
      test_email:
        description: "Test: send only this subscriber's alerts (sign up + confirm first)"
        type: string
        default: ""
      since:
        description: "Test: include listings since YYYY-MM-DD (does not advance last_sent_at)"
        type: string
        default: ""

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Send weekly new-listing alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          TEST_EMAIL: ${{ inputs.test_email }}
          SINCE: ${{ inputs.since }}
        run: |
          ARGS="$DRY"
          [ -n "$TEST_EMAIL" ] && ARGS="$ARGS --to $TEST_EMAIL"
          [ -n "$SINCE" ] && ARGS="$ARGS --since $SINCE"
          npx -y tsx scripts/send_alert_digest.ts $ARGS
