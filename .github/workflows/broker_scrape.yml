name: Daily broker scrape

on:
  schedule:
    - cron: "23 14 * * *"   # 14:23 UTC. Deliberately off :00 - GitHub queues top-of-hour crons and can drop them; 2026-09-21 was skipped entirely.
  workflow_dispatch:
    inputs:
      stale_first:
        description: "Order by staleness (untick for a control run)"
        type: boolean
        default: true
      top_n:
        description: "Brokers per shard (4 shards)"
        default: "100"
      order:
        description: "weekly (default) | yield | stale | never"
        default: "weekly"
      new_broker_quota:
        description: "Never-scraped brokers to put at the front"
        default: "40"

# Layout (2026-09-24):
#
#   plan ──► scrape (4 parallel shards) ──► commit
#
# plan    builds the broker list from broker_sources, orders it ONCE via the
#         broker_last_seen() RPC, and uploads the ordered list. Ordering is
#         fatal: if it fails the job fails and no shard runs. (Before this,
#         a failed ordering fell back to CSV order silently.)
# scrape  shard i of 4 takes every 4th broker of that one ordering
#         (round-robin, so every shard starts on the most-due brokers) and
#         crawls --top-n of them. No shared state, no concurrency group.
# commit  merges the shard snapshots into data/snapshots/<date>/, checks the
#         first_seen invariant, commits, refreshes the homepage view. This is
#         the only job that pushes, so it is the only one in a concurrency
#         group.
#
# ROOT CAUSE of the 2026-09-18..23 "CSV rows 1-110" snapshots: the old step
# built the flag with ${{ (inputs.stale_first == false) && ' ' || '--stale-first' }}.
# On a scheduled run `inputs` is empty, and GitHub's loose equality coerces
# null == false to true (both become 0), so every SCHEDULED run dropped
# --stale-first and crawled the CSV in file order. Manual runs were fine,
# which is why it looked intermittent. The flag is now decided in bash from
# an env var that is '' on schedule and only 'false' when explicitly unticked.

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install curl_cffi==0.13.0 pandas beautifulsoup4 playwright requests supabase colorama

      - name: Build broker list from broker_sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/export_brokers_csv.py --out data/brokers_clean.csv

      - name: Order brokers (fatal on failure)
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ORDER: ${{ inputs.order || 'weekly' }}
          NEW_BROKER_QUOTA: ${{ inputs.new_broker_quota || '40' }}
          REFRESH_CYCLE_DAYS: "7"
          STALE_FIRST: ${{ inputs.stale_first }}   # '' on schedule
          TOP_N: ${{ inputs.top_n || '100' }}
        run: |
          FLAG="--stale-first"
          if [ "$STALE_FIRST" = "false" ]; then
            FLAG=""
            echo "::warning::stale_first unticked - control run in CSV order"
          fi
          python3 -u scrapers/dealledger_scraper_v6.py \
            --brokers data/brokers_clean.csv $FLAG \
            --top-n $(( TOP_N * 4 )) \
            --plan-out plan/ordered_brokers.csv
          echo "Planned $(($(wc -l < plan/ordered_brokers.csv) - 1)) brokers"
          head -6 plan/ordered_brokers.csv

      - uses: actions/upload-artifact@v4
        with:
          name: broker-plan
          path: |
            plan/ordered_brokers.csv
            data/brokers_clean.csv
          retention-days: 30
          if-no-files-found: error

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 2026-09-09 (#154): playwright install-deps lost an apt mirror race
      # ("Some index files failed to download", exit 100). No retry, so the
      # scraper step was skipped entirely and the day produced nothing.
      - name: Install dependencies
        run: |
          pip install curl_cffi==0.13.0 pandas beautifulsoup4 playwright requests supabase colorama
          playwright install chromium
          for attempt in 1 2 3; do
            sudo apt-get update -qq || true
            if playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps failed (attempt $attempt/3); retrying in 30s"
            sleep 30
          done
          echo "::error::playwright install-deps failed three times"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: broker-plan

      # `timeout` sends SIGINT at 4h45m, well inside the 350-minute job
      # limit. Python raises KeyboardInterrupt, the scraper unwinds, and
      # the upload step still runs. Exit 124 = hit that limit (partial).
      # Output goes to out/snapshots, not data/snapshots, so the artifact
      # holds only this run's shard and not the whole committed history.
      - name: Run V6 scraper (shard ${{ matrix.shard }}/4)
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set +e
          timeout --signal=INT 285m \
          python3 -u scrapers/dealledger_scraper_v6.py \
            --brokers plan/ordered_brokers.csv \
            --shard ${{ matrix.shard }}/4 \
            --top-n ${{ inputs.top_n || '100' }} \
            --output out/snapshots
          CODE=$?
          set -e
          if [ $CODE -eq 124 ]; then
            echo "::warning::Shard ${{ matrix.shard }} hit the 285-minute guard and was stopped early. Keeping partial results."
          elif [ $CODE -ne 0 ]; then
            echo "::warning::Shard ${{ matrix.shard }} exited with code $CODE. Keeping whatever landed."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-shard-${{ matrix.shard }}
          path: out/snapshots/
          retention-days: 30
          if-no-files-found: warn

  commit:
    needs: [plan, scrape]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that pushes. Serialises against other runs of this
    # workflow's commit step; shards never wait on it.
    concurrency:
      group: broker-scrape-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests

      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-shard-*
          path: shards

      - name: Merge shard snapshots
        run: |
          mkdir -p shards merged
          python3 scripts/merge_snapshot_shards.py shards merged
          cp -R merged/. data/snapshots/

      # Fails the job if any active row's first_seen moved later than the
      # baseline committed by the last run — the exact regression that cost
      # a week of DOM accuracy on execbb/fcbb/murphybusiness (CLAUDE.md #11,
      # #13).
      - name: Check first_seen invariant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scrapers/first_seen_monitor.py

      # always() so a failed invariant check still saves the scrape's work.
      # Also commits the first_seen baseline the invariant check just wrote.
      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "dealledger-bot"
          git config user.email "bot@dealledger.org"
          git add -f data/snapshots/ data/first_seen_baseline.json
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          SUFFIX=""
          if [ "${{ needs.scrape.result }}" != "success" ] || \
             grep -qs '"interrupted": true' data/snapshots/$(date -u +%Y-%m-%d)/summary.json; then
            SUFFIX=" (partial)"
          fi
          git commit -m "snapshot: $(date -u +%Y-%m-%d)${SUFFIX}"
          # -X theirs: on a conflict, keep THIS run's copy of the generated
          # file (run #162, 2026-09-16: conflict in first_seen_baseline.json).
          if ! git pull --rebase -X theirs --autostash origin ${{ github.ref_name }}; then
            git rebase --abort || true
            echo "::warning::Could not rebase onto origin; result is committed locally only."
          fi
          git push || echo "Push failed — snapshot is committed locally only."

      # Rebuild the homepage's materialized view so new listings actually
      # appear on the site. CONCURRENTLY keeps the page serving during it.
      - name: Refresh homepage view
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_listings_page" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Sweep crawl_run rows left 'running' > 6h (pg_cron also does this
      # hourly; running it here keeps the scorecard honest right after a run).
      - name: Expire stale crawl_run rows
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/expire_stale_crawl_runs" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "::warning::expire_stale_crawl_runs failed"

      # Second copy of the merged output, independent of git.
      - name: Upload merged snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          path: merged/
          retention-days: 30
          if-no-files-found: warn
