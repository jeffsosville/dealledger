name: Daily broker scrape

on:
  schedule:
    - cron: "23 14 * * *"   # 14:23 UTC. Deliberately off :00 - GitHub queues top-of-hour crons and can drop them; 2026-09-21 was skipped entirely.
  workflow_dispatch:
    inputs:
      stale_first:
        description: "Order by staleness (untick for a control run)"
        type: boolean
        default: true
      top_n:
        description: "Brokers to attempt"
        default: "100"
      order:
        description: "weekly (default) | yield | stale | never"
        default: "weekly"
      new_broker_quota:
        description: "Never-scraped brokers to put at the front"
        default: "40"

# The commit step pushes back to the repo, so the token needs write.
permissions:
  contents: write

# Never let two scrapes run at once — they'd fight over data/snapshots/.
concurrency:
  group: broker-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 2026-09-09 (#154): playwright install-deps lost an apt mirror race
      # ("Some index files failed to download", exit 100). No retry, so the
      # scraper step was skipped entirely and the day produced nothing.
      - name: Install dependencies
        run: |
          pip install curl_cffi==0.13.0 pandas beautifulsoup4 playwright requests supabase colorama
          playwright install chromium
          for attempt in 1 2 3; do
            sudo apt-get update -qq || true
            if playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps failed (attempt $attempt/3); retrying in 30s"
            sleep 30
          done
          echo "::error::playwright install-deps failed three times"
          exit 1

      # `timeout` sends SIGINT at 4h45m, well inside the 350-minute job
      # limit. Python raises KeyboardInterrupt, the scraper unwinds, and
      # the commit step still gets a chance to run. Exit code 124 means
      # we hit that limit; treat it as a partial success, not a failure.
      - name: Run V6 scraper
        id: scrape
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # ORDER=weekly: skip the brokers specialized_scrape.yml already
          # crawls at 08:00 UTC, refresh the stalest 1/7 of the remaining
          # producers, and give the freed slots to never-scraped brokers.
          # ORDER=yield restores the old same-100-every-night behaviour.
          ORDER: ${{ inputs.order || 'weekly' }}
          NEW_BROKER_QUOTA: ${{ inputs.new_broker_quota || '40' }}
          REFRESH_CYCLE_DAYS: "7"
        run: |
          set +e
          timeout --signal=INT 285m \
          python3 -u scrapers/dealledger_scraper_v6.py \
            --brokers data/brokers_clean.csv \
            ${{ (inputs.stale_first == false) && ' ' || '--stale-first' }} \
            --top-n ${{ inputs.top_n || '100' }} \
            --output data/snapshots
          CODE=$?
          set -e
          if [ $CODE -eq 124 ]; then
            echo "::warning::Scraper hit the 285-minute guard and was stopped early. Committing partial results."
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ $CODE -ne 0 ]; then
            echo "::warning::Scraper exited with code $CODE. Committing whatever landed."
            echo "partial=true" >> "$GITHUB_OUTPUT"
          else
            echo "partial=false" >> "$GITHUB_OUTPUT"
          fi

      # Fails the job if any active row's first_seen moved later than the
      # baseline committed by the last run — the exact regression that cost
      # a week of DOM accuracy on execbb/fcbb/murphybusiness (CLAUDE.md #11,
      # #13). if: always() so a scraper failure still gets checked against
      # whatever it did manage to write.
      - name: Check first_seen invariant
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scrapers/first_seen_monitor.py

      # always() so a cancelled or failed scrape still saves its work.
      # This is the fix for the run that lost 97 brokers' output.
      #
      # Also commits the first_seen baseline the invariant check just wrote.
      # It has to survive between runs to mean anything — a fresh container
      # every run with no persisted state would never have a prior value to
      # diff against; committing it here is what closes that gap.
      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "dealledger-bot"
          git config user.email "bot@dealledger.org"
          git add -f data/snapshots/ data/first_seen_baseline.json
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          SUFFIX=""
          if [ "${{ steps.scrape.outputs.partial }}" = "true" ]; then
            SUFFIX=" (partial)"
          fi
          git commit -m "snapshot: $(date -u +%Y-%m-%d)${SUFFIX}"
          # Another workflow may have pushed while we ran.
          # -X theirs: on a conflict, keep THIS run's copy of the generated
          # file (in a rebase "theirs" is the commit being replayed). A plain
          # rebase left the runner on a detached HEAD and lost the push
          # (run #162, 2026-09-16: conflict in first_seen_baseline.json).
          if ! git pull --rebase -X theirs --autostash origin ${{ github.ref_name }}; then
            git rebase --abort || true
            echo "::warning::Could not rebase onto origin; result is committed locally only."
          fi
          git push || echo "Push failed — snapshot is committed locally only."
      # Rebuild the homepage's materialized view so new listings actually
      # appear on the site. CONCURRENTLY keeps the page serving during it.
      - name: Refresh homepage view
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/refresh_listings_page" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
      # Second copy of the output, independent of git. If the push ever
      # fails, the data is still downloadable from the run page for 30 days.
      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          path: data/snapshots/
          retention-days: 30
          if-no-files-found: warn
