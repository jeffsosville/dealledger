name: Daily broker scrape
on:
  schedule:
    - cron: '0 14 * * *'  # 9am ET daily
  workflow_dispatch:       # manual trigger from GitHub UI
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas beautifulsoup4 playwright requests supabase colorama
          playwright install chromium
          playwright install-deps chromium
      - name: Run V6 scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python3 scrapers/dealledger_scraper_v6.py \
            --brokers data/brokers_clean.csv \
            --stale-first \
            --top-n 250 \
            --output data/snapshots
      - name: Commit snapshot
        run: |
          git config user.name "dealledger-bot"
          git config user.email "bot@dealledger.org"
          git add -f data/snapshots/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"
