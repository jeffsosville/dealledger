name: Daily broker scrape
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10am ET daily
  workflow_dispatch:
    inputs:
      stale_first:
        description: "Order by staleness (untick for a control run)"
        type: boolean
        default: true
      top_n:
        description: "Brokers to attempt"
        default: "100"
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install curl_cffi==0.13.0 pandas beautifulsoup4 playwright requests supabase colorama
          playwright install chromium
          playwright install-deps chromium
      - name: Run V6 scraper
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python3 -u scrapers/dealledger_scraper_v6.py \
            --brokers data/brokers_clean.csv \
            ${{ (inputs.stale_first == false) && ' ' || '--stale-first' }} \
            --top-n ${{ inputs.top_n || '100' }} \
            --output data/snapshots
      - name: Commit snapshot
        run: |
          git config user.name "dealledger-bot"
          git config user.email "bot@dealledger.org"
          git add -f data/snapshots/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"
