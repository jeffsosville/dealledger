name: Daily report (Today issue)

# Posts "Today — YYYY-MM-DD" from public.daily_ops_report() (Nov 21 2026):
# 1 what broke, 2 fixed and verified, 3 core numbers, 4 needs your decision.
# Report only. Closes yesterday's issue. Decisions live in private.decisions_pending.
#
# 16:07 UTC: after the bridge (15:00) and homepage refresh (15:25).

on:
  # Scheduled by Supabase pg_cron job 'gh-daily-report' (16:07 UTC) via dispatch_workflow():
  # GitHub's own cron started this repo's jobs 4-7h late (Oct 2026). Manual runs still work.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # report every credential here so a dead key shows up in the daily issue run
        run: python3 scripts/check_credentials.py --need supabase,proxy,anthropic
      - name: Post daily report (replaces the old Today issue + triage)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/daily_ops_report" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' | python3 -c 'import json,sys; print(json.load(sys.stdin))' > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh label create today --color 0E8A16 --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label today --state open --json number -q '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --label today --assignee jeffsosville \
            --title "Today — $(date -u +%F)" --body-file report.md
