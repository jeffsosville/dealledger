name: Daily Scrape

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi pandas selenium webdriver-manager playwright
          playwright install chromium

      - name: Run specialized scrapers (big 8)
        continue-on-error: true
        run: |
          python3 scrapers/specialized_scrapers.py

      - name: Run v4 agent (independent brokers)
        run: |
          python agents/scraper_agent_v4.py --batch data/brokers_clean.csv --workers 5

      - name: Build snapshot
        run: |
          python3 - << 'PYEOF'
          import json, glob, os, csv, hashlib
          from datetime import datetime, timezone

          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          os.makedirs(f'data/snapshots/{today}', exist_ok=True)
          all_listings = []
          seen = set()

          for f in glob.glob('data/listings/*.json') + glob.glob('data/listings/*.jsonl'):
              try:
                  with open(f) as fh:
                      data = [json.loads(l) for l in fh] if f.endswith('.jsonl') else json.load(fh)
                  if not isinstance(data, list): continue
                  for l in data:
                      uid = l.get('id') or l.get('listing_id') or hashlib.md5((l.get('source_url') or l.get('listing_url') or '').encode()).hexdigest()
                      if uid in seen: continue
                      seen.add(uid)
                      all_listings.append({'id': uid, 'source_url': l.get('source_url') or l.get('listing_url',''), 'broker_name': l.get('broker_name') or l.get('broker',''), 'title': l.get('title',''), 'asking_price': l.get('asking_price') or l.get('price',''), 'revenue': l.get('revenue',''), 'cash_flow': l.get('cash_flow',''), 'state': l.get('state',''), 'city': l.get('city',''), 'business_type': l.get('business_type',''), 'first_seen': l.get('first_seen') or today, 'status': l.get('status','active')})
              except: pass

          all_listings.sort(key=lambda x: x.get('first_seen',''), reverse=True)
          json.dump(all_listings, open(f'data/snapshots/{today}/listings.json','w'), default=str)
          json.dump(all_listings, open('data/latest.json','w'), default=str)
          print(f"Total: {len(all_listings)}")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "DealLedger Bot"
          git config user.email "bot@dealledger.org"
          git add data/snapshots/ data/latest.json data/latest.csv data/listings/ data/scraper_configs/
          git commit -m "Daily scrape $(date +%Y-%m-%d)" || echo "No changes"
          git push || echo "Nothing to push"
