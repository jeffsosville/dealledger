name: Daily broker discovery

# Finds listings pages for brokers in broker_sources still at
# 1_needs_discovery (v_discovery_queue, IBBA members first) and writes every
# result back onto broker_sources:
#
#   ok                -> 3_crawlable   (crawled by broker_scrape.yml the same day)
#   weak              -> 2_listings_url_known / needs_work
#   no page, dead ... -> 0_unusable
#   blocked           -> 0_blocked
#
# broker_scrape.yml (14:23 UTC) builds its list from broker_sources stages
# 3_crawlable + 4_producing at job start, so there is no CSV to export or
# commit any more (2026-09-24; agents/export_discovered_ok.py removed).
# promote_producing_brokers() (pg_cron, 21:17 UTC) moves 3 -> 4 once a broker
# has live listings.
#
# Re-enabled 2026-09-24. It had been manual-only since 2026-09-15 and the
# queue sat at 1,384 unprobed brokers.

on:
  schedule:
    - cron: "23 11 * * *"   # 11:23 UTC, three hours before broker_scrape. Off :00 - GitHub queues top-of-hour crons.
  workflow_dispatch:
    inputs:
      limit:
        description: "Domains to probe"
        default: "75"
      seed:
        description: "Only broker_sources rows whose seed_source contains this (blank = all)"
        default: ""

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install curl_cffi==0.13.0 beautifulsoup4 playwright requests supabase
          playwright install chromium
          for attempt in 1 2 3; do
            sudo apt-get update -qq || true
            if playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps failed (attempt $attempt/3); retrying in 30s"
            sleep 30
          done
          echo "::error::playwright install-deps failed three times"
          exit 1

      # Each domain has a 90s watchdog, so 75 domains is ~110 min worst case;
      # most resolve in seconds. timeout sends SIGINT inside the job limit.
      # Every result is written to broker_sources as it is found, so a
      # timed-out run keeps what it resolved.
      - name: Discover listings pages
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE: broker_sources
          SEED: ${{ inputs.seed || '' }}
          LIMIT: ${{ inputs.limit || '75' }}
        run: |
          set +e
          timeout --signal=INT 130m python3 -u agents/discover_backlog.py
          CODE=$?
          set -e
          if [ $CODE -eq 124 ]; then
            echo "::warning::discovery hit the 130-minute guard; results so far are saved."
          elif [ $CODE -ne 0 ]; then
            echo "::error::discover_backlog.py exited with code $CODE"
            exit $CODE
          fi
