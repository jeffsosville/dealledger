name: Public data export

# Writes data/public/listings.csv, listings.json, listings_left_observation.csv
# and meta.json, then verifies them against the database
# (scripts/verify_public_export.py). Files are committed only if every check
# passes; a failed check leaves yesterday's files in place and fails the job.
#
# Triggered daily by pg_cron job gh-export-public (15:55 UTC, after
# refresh-homepage-v2 at 15:32 builds listing_age_v2), like the other gh-* jobs.
# GitHub's own schedule is not used: it stopped firing after 2026-10-08.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests

      - name: Offline tests
        run: python tests/test_public_export.py

      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_public_listings.py

      - name: Verify (gate)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/verify_public_export.py --dir data/public

      - name: Keep the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: data/public/verification.json
          if-no-files-found: warn

      - name: Commit
        run: |
          git config user.name "dealledger-bot"
          git config user.email "bot@dealledger.org"
          git add data/public/listings.csv data/public/listings.json data/public/meta.json \
                  data/public/listings_left_observation.csv data/public/verification.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "public export: $(date -u +%Y-%m-%d) (verified)"
          git pull --rebase -X theirs --autostash origin ${{ github.ref_name }}
          git push
