name: BBS Weekly Full Laundromat Scrape

on:
  schedule:
    - cron: '0 12 * * 0'  # Sundays 7am ET
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi supabase

      - name: Run BBS full scrape
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scrapers/bbs_pipeline.py --mode full
