name: DealLedger Daily Pipeline

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  bbs_scrape:
    name: BizBuySell Scrape
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install "curl_cffi==0.6.2" supabase requests colorama
      - name: Run BBS all-states scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scrapers/bbs_allstates.py fresh

  quality_score:
    name: Quality Scoring
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: bbs_scrape
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install supabase requests
      - name: Score all listings
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLEANINGEXITS_ANON_KEY:     ${{ secrets.CLEANINGEXITS_ANON_KEY }}
          CLEANINGEXITS_SUPABASE_URL: ${{ secrets.CLEANINGEXITS_SUPABASE_URL }}
        run: python3 scrapers/quality_scorer.py

  relist_refresh:
    name: Relist Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality_score
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install supabase
      - name: Refresh relist flags (sticky)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scrapers/relist_refresh.py

  vertical_sync:
    name: Vertical Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: relist_refresh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install supabase requests
      - name: Sync to CleaningExits
        env:
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLEANINGEXITS_SUPABASE_URL: ${{ secrets.CLEANINGEXITS_SUPABASE_URL }}
          CLEANINGEXITS_SERVICE_KEY:  ${{ secrets.CLEANINGEXITS_SERVICE_KEY }}
        run: python3 scrapers/vertical_sync.py --vertical cleaning
