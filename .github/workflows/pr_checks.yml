name: PR checks

# Runs on every pull request. No secrets, no database, no network scraping:
# anyone's fork can pass this.
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install curl_cffi==0.16.3 beautifulsoup4 pandas requests supabase python-dotenv playwright colorama
      - name: Every Python file compiles
        run: python -m compileall -q scrapers agents scripts ingestion ledger lib
      - name: Yield-gate test
        run: python scrapers/test_yield_gate.py
      - name: Discovery-gate test
        run: python tests/test_discovery_gate.py
      - name: Marketplace-gate test
        run: python tests/test_marketplace_gate.py
      - name: Listing page source test
        run: python tests/test_listing_page_source.py
      - name: Public copy test
        run: python tests/test_public_copy.py
      - name: Public export gate test
        run: python tests/test_public_export.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
      - name: Listing page render test (local stub, no database)
        run: python tests/test_listing_page_render.py
